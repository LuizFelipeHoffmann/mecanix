spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5432/mecanix_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

spring.jackson.default-property-inclusion=NON_NULL
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.time-zone=America/Sao_Paulo

server.port=8080

# URL pública do frontend — usada nos links de volta (back_url) dos gateways de pagamento
mecanix.app.url=${APP_URL:http://localhost:5173}

# Integração de pagamento (planos pagos). Sem as chaves reais, o checkout roda
# em modo sandbox e não cobra nada — ver MercadoPagoGatewayService/AsaasGatewayService.
mecanix.pagamento.gateway-padrao=${PAGAMENTO_GATEWAY:mercadopago}
mercadopago.access-token=${MERCADOPAGO_ACCESS_TOKEN:}
asaas.api-key=${ASAAS_API_KEY:}
asaas.ambiente=${ASAAS_AMBIENTE:sandbox}

# E-mail Gmail SMTP
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
mecanix.mail.remetente=${MAIL_USERNAME}
mecanix.mail.nome=${MAIL_NOME:MECANIX Oficina}

# Chave usada pra criptografar dados sensíveis no banco (hoje, só a senha de
# app da conta de e-mail própria de cada oficina — ver CryptoUtil/Empresa).
# TROQUE em produção; se mudar depois de já existir senha salva, ela para de
# descriptografar (a oficina precisa reconfigurar o e-mail).
mecanix.crypto.secret=${CRYPTO_SECRET}

logging.level.com.mecanix=INFO
logging.level.org.springframework=WARN

# Perfil ativo — sobrescreva com SPRING_PROFILES_ACTIVE=prod em producao
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
