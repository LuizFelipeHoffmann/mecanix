<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>MECANIX — Login</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body style="overflow:auto">
<div class="lw">
  <div class="lbox">
    <div class="llogo">
      <div class="lico">
        <svg viewBox="0 0 24 24"><path d="M22.7 19l-9.1-9.1c.9-2.3.4-5-1.5-6.9-2-2-5-2.4-7.4-1.3L9 6 6 9 1.6 4.7C.4 7.1.9 10.1 2.9 12.1c1.9 1.9 4.6 2.4 6.9 1.5l9.1 9.1c.4.4 1 .4 1.4 0l2.3-2.3c.5-.4.5-1.1.1-1.4z"/></svg>
      </div>
      <div class="lnm">MECANIX</div>
      <div class="lsub">Sistema de Gestão de Oficinas</div>
    </div>

    <div id="l-err" style="display:none;background:var(--rdd);border:1px solid rgba(239,68,68,.3);border-radius:8px;padding:10px 14px;font-size:13px;color:var(--rd);margin-bottom:14px"></div>

    <div class="fg" style="margin-bottom:13px">
      <label>E-mail institucional</label>
      <input class="finp" type="email" id="l-em" placeholder="email@exemplo.com"
        onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <div class="fg" style="margin-bottom:18px">
      <label>Senha</label>
      <input class="finp" type="password" id="l-pw" placeholder="••••••••"
        onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <button class="btn btn-p btn-full" id="btn-login" onclick="doLogin()">Entrar no sistema</button>

    <div class="hint" style="margin-top:16px">
      <div class="hint-t">Perfis de demonstração</div>
      <div class="hint-r"><b>admin@mecanix.com</b> / admin123 — Acesso total</div>
      <div class="hint-r"><b>servicos@mecanix.com</b> / serv123 — Atendimento</div>
      <div class="hint-r"><b>estoque@mecanix.com</b> / est123 — Estoque</div>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script>
  // Redireciona se já logado
  if (getUser()) window.location.href = 'dashboard.html';

  async function doLogin() {
    const email = document.getElementById('l-em').value.trim();
    const senha = document.getElementById('l-pw').value;
    const err   = document.getElementById('l-err');
    const btn   = document.getElementById('btn-login');

    err.style.display = 'none';
    btn.disabled = true;
    btn.textContent = 'Entrando...';

    try {
      const user = await authAPI.login(email, senha);
      setUser(user);
      window.location.href = 'dashboard.html';
    } catch (e) {
      err.textContent = e.message || 'E-mail ou senha incorretos.';
      err.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Entrar no sistema';
    }
  }
</script>
</body>
</html>
