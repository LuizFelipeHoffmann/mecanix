<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>MECANIX — Estoque</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="sb-overlay" id="sb-overlay" onclick="closeSB()"></div>
<div class="app">
  <div class="sb" id="sb"></div>
  <div class="mn">
    <div class="topbar">
      <div class="menu-btn" onclick="toggleSB()"><svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg></div>
      <div class="ptitle" id="ptitle"></div>
      <div class="pdate" id="pdate"></div>
      <div id="top-act"></div>
    </div>
    <div class="ct" id="content"><div style="padding:40px;text-align:center;color:var(--tx3)">Carregando...</div></div>
  </div>
</div>
<script src="js/api.js"></script>
<script src="js/sidebar.js"></script>
<script>
const CATS = ['Filtros','Freios','Ignição','Lubrificantes','Suspensão','Motor','Elétrico','Transmissão','Outros'];
const TIPOS_EST = ['SEDAN','HATCH','SUV','PICKUP','ELETRICO'];

async function main() {
  const user = await initPage('estoque', 'Estoque');
  if (!user) return;
  document.getElementById('top-act').innerHTML =
    `<button class="btn btn-p sm" onclick="window.location.href='estoque.html?action=new'">+ Novo item</button>`;
  const action  = getParam('action');
  const idParam = getParam('id') ? parseInt(getParam('id')) : null;
  if (action === 'new')              await renderForm(null);
  else if (action === 'edit' && idParam) await renderForm(idParam);
  else                               await renderList();
}

async function renderList() {
  try {
    const itens = await estoqueAPI.listar();
    const alertas = itens.filter(e => e.alertaEstoque).length;
    const rows = itens.length ? itens.map(e => {
      const al = e.alertaEstoque;
      return `<tr>
        <td class="osnum">${e.codigo}</td>
        <td style="font-weight:500">${e.nome}</td>
        <td style="color:var(--tx2)">${e.categoria||'—'}</td>
        <td>
          <span style="font-weight:600;color:${al?'var(--rd)':'var(--gn)'}">${e.quantidade}</span>
          <span style="color:var(--tx3);font-size:11px"> / mín ${e.quantidadeMinima}</span>
          ${al?'<span class="badge brd2" style="margin-left:6px;font-size:10px">Baixo</span>':''}
        </td>
        <td style="font-weight:600;color:var(--or)">${fmtCur(e.precoUnitario)}</td>
        <td style="color:var(--tx2);font-size:12px">${(e.tipos||[]).join(', ')}</td>
        <td><div class="ib" onclick="window.location.href='estoque.html?action=edit&id=${e.id}'"><svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25z"/></svg></div></td>
      </tr>`;
    }).join('') : `<tr><td colspan="7" style="text-align:center;color:var(--tx3);padding:24px">Nenhum item no estoque.</td></tr>`;
    const mob = itens.map(e => {
      const al = e.alertaEstoque;
      return `<div class="mob-card">
        <div class="mob-card-top">
          <span class="osnum">${e.codigo}</span>
          ${al?'<span class="badge brd2">Estoque baixo</span>':''}
        </div>
        <div style="font-weight:600;font-size:15px;color:var(--tx);margin-bottom:4px">${e.nome}</div>
        <div class="mob-card-row">
          <span style="color:${al?'var(--rd)':'var(--gn)'};font-weight:600">${e.quantidade} un.</span>
          <span style="color:var(--or);font-weight:600">${fmtCur(e.precoUnitario)}</span>
          <div class="ib" onclick="window.location.href='estoque.html?action=edit&id=${e.id}'"><svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25z"/></svg></div>
        </div>
      </div>`;
    }).join('');
    document.getElementById('content').innerHTML = `
    ${alertas>0?`<div style="background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.2);border-radius:10px;padding:12px 16px;margin-bottom:16px;color:var(--rd);font-size:13px">
      ⚠️ <strong>${alertas} item(ns)</strong> com estoque abaixo do mínimo.
    </div>`:''}
    <div class="card">
      <div class="chd"><div class="ctitle">Estoque (${itens.length} itens)</div></div>
      <div class="tbl-wrap tbl-desktop"><table class="tbl">
        <thead><tr><th>Código</th><th>Nome</th><th>Categoria</th><th>Quantidade</th><th>Preço Unit.</th><th>Compatível</th><th></th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>
      <div class="mob-list cbd">${mob}</div>
    </div>`;
  } catch(e) {
    document.getElementById('content').innerHTML = `<div style="padding:20px;color:var(--rd)">Erro: ${e.message}</div>`;
  }
}

async function renderForm(editId) {
  document.getElementById('ptitle').textContent = editId ? 'Editar Item' : 'Novo Item';
  document.getElementById('top-act').innerHTML = `<button class="btn btn-g sm" onclick="window.location.href='estoque.html'">← Voltar</button>`;
  let e = null;
  try { if (editId) e = await estoqueAPI.buscar(editId); } catch {}
  const catOpts = CATS.map(c=>`<option value="${c}" ${e?.categoria===c?'selected':''}>${c}</option>`).join('');
  const tipoChecks = TIPOS_EST.map(t => {
    const checked = e?.tipos && e.tipos.includes(t) ? 'checked' : '';
    return `<label style="display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer">
      <input type="checkbox" name="tipos" value="${t}" ${checked}> ${TIPO_LABELS[t]||t}
    </label>`;
  }).join('');
  document.getElementById('content').innerHTML = `
  <div class="card">
    <div class="chd"><div class="ctitle">${editId?'Editar':'Novo'} Item</div></div>
    <div class="cbd">
      <div class="fgrid">
        <div class="fg"><label>Código *</label><input class="finp" type="text" id="e-cod" value="${e?.codigo||''}" placeholder="Ex: FO-920" style="text-transform:uppercase" oninput="this.value=this.value.toUpperCase()"></div>
        <div class="fg"><label>Categoria</label><select class="finp" id="e-cat"><option value="">Selecione...</option>${catOpts}</select></div>
        <div class="fg full"><label>Nome *</label><input class="finp" type="text" id="e-nome" value="${e?.nome||''}" placeholder="Ex: Filtro de óleo W920"></div>
        <div class="fg"><label>Quantidade *</label><input class="finp" type="number" id="e-qtd" value="${e?.quantidade??''}" placeholder="0" min="0"></div>
        <div class="fg"><label>Qtd. mínima *</label><input class="finp" type="number" id="e-min" value="${e?.quantidadeMinima??''}" placeholder="5" min="0"></div>
        <div class="fg"><label>Preço unitário *</label><input class="finp" type="number" id="e-preco" value="${e?.precoUnitario??''}" placeholder="0.00" step="0.01" min="0"></div>
        <div class="fg full">
          <label>Compatível com</label>
          <div style="display:flex;flex-wrap:wrap;gap:14px;margin-top:8px">${tipoChecks}</div>
        </div>
      </div>
      <div id="f-err" style="display:none;background:var(--rdd);border:1px solid rgba(239,68,68,.3);border-radius:8px;padding:10px 14px;font-size:13px;color:var(--rd);margin-bottom:12px"></div>
      <div class="factions">
        <button class="btn btn-g" onclick="window.location.href='estoque.html'">Cancelar</button>
        ${editId?`<button class="btn btn-d" onclick="delItem(${editId})">Excluir</button>`:''}
        <button class="btn btn-p" id="btn-save" onclick="saveItem(${editId||0})">${editId?'Salvar':'Cadastrar'}</button>
      </div>
    </div>
  </div>`;
}

async function saveItem(editId) {
  const btn = document.getElementById('btn-save');
  const tipos = [...document.querySelectorAll('input[name="tipos"]:checked')].map(c=>c.value);
  const dados = {
    codigo: document.getElementById('e-cod').value.trim().toUpperCase(),
    nome: document.getElementById('e-nome').value.trim(),
    categoria: document.getElementById('e-cat').value,
    quantidade: parseInt(document.getElementById('e-qtd').value)||0,
    quantidadeMinima: parseInt(document.getElementById('e-min').value)||0,
    precoUnitario: parseFloat(document.getElementById('e-preco').value)||0,
    tipos,
  };
  if (!dados.codigo) return showError('Informe o código');
  if (!dados.nome)   return showError('Informe o nome');
  btn.disabled=true; btn.textContent='Salvando...';
  try {
    if (editId) await estoqueAPI.atualizar(editId, dados);
    else        await estoqueAPI.criar(dados);
    window.location.href = 'estoque.html';
  } catch(e) { showError(e.message); btn.disabled=false; btn.textContent=editId?'Salvar':'Cadastrar'; }
}
async function delItem(id) {
  if (!confirm('Excluir este item?')) return;
  try { await estoqueAPI.deletar(id); window.location.href='estoque.html'; }
  catch(e) { alert('Erro: '+e.message); }
}
main();
</script>
</body>
</html>
