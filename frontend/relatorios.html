<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>MECANIX — Relatórios</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="sb-overlay" id="sb-overlay" onclick="closeSB()"></div>
<div class="app">
  <div class="sb" id="sb"></div>
  <div class="mn">
    <div class="topbar">
      <div class="menu-btn" onclick="toggleSB()"><svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg></div>
      <div class="ptitle" id="ptitle"></div>
      <div class="pdate" id="pdate"></div>
      <div id="top-act"></div>
    </div>
    <div class="ct" id="content"><div style="padding:40px;text-align:center;color:var(--tx3)">Carregando...</div></div>
  </div>
</div>
<script src="js/api.js"></script>
<script src="js/sidebar.js"></script>
<script>
async function main() {
  const user = await initPage('relatorios', 'Relatórios');
  if (!user) return;
  document.getElementById('top-act').innerHTML =
    `<button class="btn btn-g sm" onclick="window.print()">🖨️ Imprimir</button>`;
  try {
    const [ordens, clientes, veiculos, estoque] = await Promise.all([
      ordensAPI.listar(), clientesAPI.listar(), veiculosAPI.listar(), estoqueAPI.listar()
    ]);
    renderRelatorios(ordens, clientes, veiculos, estoque);
  } catch(e) {
    document.getElementById('content').innerHTML = `<div style="padding:20px;color:var(--rd)">Erro: ${e.message}</div>`;
  }
}

function renderRelatorios(ordens, clientes, veiculos, estoque) {
  const done   = ordens.filter(o => o.status === 'CONCLUIDO');
  const open   = ordens.filter(o => o.status === 'ANDAMENTO' || o.status === 'AGUARDANDO');
  const sched  = ordens.filter(o => o.status === 'AGENDADO');
  const total  = ordens.length;
  const rev    = done.reduce((a,o)  => a + (parseFloat(o.total)||0), 0);
  const revOp  = open.reduce((a,o)  => a + (parseFloat(o.total)||0), 0);
  const maoO   = done.reduce((a,o)  => a + (parseFloat(o.totalServicos)||0), 0);
  const pecOb  = done.reduce((a,o)  => a + (parseFloat(o.totalPecas)||0), 0);
  const ticket = done.length ? rev / done.length : 0;
  const alertas = estoque.filter(e => e.alertaEstoque);

  // Serviços mais comuns
  const svcMap = {};
  ordens.forEach(o => (o.servicos||[]).forEach(s => {
    const k = (s.descricao||'').trim().toLowerCase();
    const cat = k.includes('óleo')||k.includes('oleo') ? 'Troca de óleo'
      : k.includes('frei')   ? 'Serviço de freios'
      : k.includes('elétri') ? 'Elétrica'
      : k.includes('suspens')||k.includes('amort') ? 'Suspensão'
      : k.includes('alinha') ? 'Alinhamento'
      : k.includes('diagnos')? 'Diagnóstico'
      : 'Outros';
    svcMap[cat] = (svcMap[cat]||0) + 1;
  }));
  const topSvcs = Object.entries(svcMap).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const maxSvc  = topSvcs[0]?.[1] || 1;

  // Top clientes por receita
  const cliRev = {};
  done.forEach(o => {
    const k = o.clienteNome || 'Desconhecido';
    cliRev[k] = (cliRev[k]||0) + (parseFloat(o.total)||0);
  });
  const topCli = Object.entries(cliRev).sort((a,b)=>b[1]-a[1]).slice(0,5);

  document.getElementById('content').innerHTML = `
  <div class="metrics" style="margin-bottom:20px">
    <div class="met">
      <div class="mlbl">Faturamento concluído</div>
      <div class="mval" style="font-size:16px">${fmtCur(rev)}</div>
      <div class="msub">${done.length} OS concluída(s)</div>
      <div class="mico" style="background:var(--ord)"><svg viewBox="0 0 24 24" fill="var(--or)" width="14" height="14"><path d="M11.8 10.9c-2.27-.59-3-1.2-3-2.15 0-1.09 1.01-1.85 2.7-1.85 1.78 0 2.44.85 2.5 2.1h2.21c-.07-1.72-1.12-3.3-3.21-3.81V3h-3v2.16c-1.94.42-3.5 1.68-3.5 3.61 0 2.31 1.91 3.46 4.7 4.13 2.5.6 3 1.48 3 2.41 0 .69-.49 1.79-2.7 1.79-2.06 0-2.87-.92-2.98-2.1h-2.2c.12 2.19 1.76 3.42 3.68 3.83V21h3v-2.15c1.95-.37 3.5-1.5 3.5-3.55 0-2.84-2.43-3.81-4.7-4.4z"/></svg></div>
    </div>
    <div class="met" style="--mac:var(--bl)">
      <div class="mlbl">Ticket médio</div>
      <div class="mval" style="font-size:16px">${fmtCur(ticket)}</div>
      <div class="msub">por OS concluída</div>
      <div class="mico" style="background:var(--bld)"><svg viewBox="0 0 24 24" fill="var(--bl)" width="14" height="14"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z"/></svg></div>
    </div>
    <div class="met" style="--mac:var(--yw)">
      <div class="mlbl">Em aberto (potencial)</div>
      <div class="mval" style="font-size:16px">${fmtCur(revOp)}</div>
      <div class="msub">${open.length} OS em andamento</div>
      <div class="mico" style="background:var(--ywd)"><svg viewBox="0 0 24 24" fill="var(--yw)" width="14" height="14"><path d="M14 2H6c-1.1 0-2 .9-2 2v16h16V8z"/></svg></div>
    </div>
    <div class="met" style="--mac:var(--gn)">
      <div class="mlbl">Total de clientes</div>
      <div class="mval">${clientes.length}</div>
      <div class="msub">${veiculos.length} veículo(s) cadastrado(s)</div>
      <div class="mico" style="background:var(--gnd)"><svg viewBox="0 0 24 24" fill="var(--gn)" width="14" height="14"><path d="M16 11c1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3 1.34 3 3 3zm-8 0c1.66 0 3-1.34 3-3S9.66 5 8 5 5 6.34 5 8s1.34 3 3 3z"/></svg></div>
    </div>
  </div>

  <div class="g2">
    <div style="display:flex;flex-direction:column;gap:16px">
      <div class="card">
        <div class="chd"><div class="ctitle">Resumo financeiro</div></div>
        <div class="cbd">
          ${[
            ['Receita total (concluídas)', fmtCur(rev), 'var(--gn)'],
            ['Mão de obra', fmtCur(maoO), 'var(--bl)'],
            ['Peças', fmtCur(pecOb), 'var(--or)'],
            ['Ticket médio', fmtCur(ticket), 'var(--tx)'],
            ['Em aberto (potencial)', fmtCur(revOp), 'var(--yw)'],
          ].map(([l,v,c])=>`<div style="display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--br)">
            <span style="font-size:13px;color:var(--tx2)">${l}</span>
            <span style="font-weight:700;color:${c}">${v}</span>
          </div>`).join('')}
        </div>
      </div>
      <div class="card">
        <div class="chd"><div class="ctitle">Situação das OS</div></div>
        <div class="cbd">
          ${[
            ['Concluídas',done.length,'var(--gn)'],
            ['Em andamento',open.filter(o=>o.status==='ANDAMENTO').length,'var(--yw)'],
            ['Aguardando peça',open.filter(o=>o.status==='AGUARDANDO').length,'var(--bl)'],
            ['Agendadas',sched.length,'var(--or)'],
            ['Total',total,'var(--tx)'],
          ].map(([l,v,c])=>`<div style="display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--br)">
            <span style="font-size:13px;color:var(--tx2)">${l}</span>
            <span style="font-weight:700;color:${c}">${v}</span>
          </div>`).join('')}
        </div>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:16px">
      <div class="card">
        <div class="chd"><div class="ctitle">Serviços mais realizados</div></div>
        <div class="cbd">
          ${topSvcs.length ? topSvcs.map(([l,n])=>`<div class="prow">
            <div style="font-size:12px;color:var(--tx2);width:100px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${l}</div>
            <div class="pbar"><div class="pfill" style="width:${Math.round(n/maxSvc*100)}%"></div></div>
            <div style="font-size:12px;color:var(--tx2);width:24px;text-align:right">${n}</div>
          </div>`).join('') : '<div style="color:var(--tx3);font-size:12px">Sem dados suficientes.</div>'}
        </div>
      </div>
      <div class="card">
        <div class="chd"><div class="ctitle">Top clientes por receita</div></div>
        <div class="cbd">
          ${topCli.length ? topCli.map(([nome,val],i)=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--br)">
            <div style="display:flex;align-items:center;gap:10px">
              <div style="width:22px;height:22px;border-radius:50%;background:var(--ord);color:var(--or);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center">${i+1}</div>
              <span style="font-size:13px;font-weight:500">${nome}</span>
            </div>
            <span style="font-weight:700;color:var(--or)">${fmtCur(val)}</span>
          </div>`).join('') : '<div style="color:var(--tx3);font-size:12px">Sem dados.</div>'}
        </div>
      </div>
      ${alertas.length ? `<div class="card" style="border-color:rgba(239,68,68,.2)">
        <div class="chd"><div class="ctitle" style="color:var(--rd)">Alertas de estoque</div></div>
        <div class="cbd">
          ${alertas.map(e=>`<div class="ai">
            <svg viewBox="0 0 24 24" fill="currentColor" width="14" height="14"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
            <div style="font-size:13px;flex:1">${e.nome}</div>
            <div style="font-size:12px;color:var(--rd);font-weight:600">${e.quantidade} un.</div>
          </div>`).join('')}
        </div>
      </div>` : ''}
    </div>
  </div>`;
}
main();
</script>
</body>
</html>
