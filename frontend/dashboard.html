<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>MECANIX — Dashboard</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="email-toast" id="email-toast">
  <div class="toast-hd">
    <div class="toast-ico"><svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg></div>
    <div class="toast-title">E-mail enviado ao cliente</div>
    <div class="toast-close" onclick="closeToast()">×</div>
  </div>
  <div class="toast-body" id="toast-body"></div>
</div>
<div class="sb-overlay" id="sb-overlay" onclick="closeSB()"></div>
<div class="app">
  <div class="sb" id="sb"></div>
  <div class="mn">
    <div class="topbar">
      <div class="menu-btn" onclick="toggleSB()"><svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg></div>
      <div class="ptitle" id="ptitle"></div>
      <div class="pdate" id="pdate"></div>
      <div id="top-act"></div>
    </div>
    <div class="ct" id="content"><div style="padding:40px;text-align:center;color:var(--tx3)">Carregando...</div></div>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/marcas.js"></script>
<script src="js/sidebar.js"></script>
<script>
async function main() {
  const user = await initPage('dashboard', 'Dashboard');
  if (!user) return;

  if (user.perfil !== 'ESTOQUE') {
    document.getElementById('top-act').innerHTML =
      `<button class="btn btn-p sm" onclick="window.location.href='os.html?action=new'">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>Nova OS
      </button>`;
  }

  try {
    const [dash, ordens, alertas] = await Promise.all([
      dashboardAPI.get(),
      ordensAPI.listar(),
      estoqueAPI.listarAlertas(),
    ]);
    renderDashboard(user, dash, ordens, alertas);
  } catch(e) {
    document.getElementById('content').innerHTML =
      `<div style="padding:20px;color:var(--rd)">Erro ao carregar: ${e.message}</div>`;
  }
}

function renderDashboard(user, dash, ordens, alertas) {
  const recentes = ordens.slice(0, 5);

  // Serviços mais comuns
  const sf = {};
  ordens.forEach(o => (o.servicos||[]).forEach(s => {
    const d = (s.descricao||'').toLowerCase();
    const k = d.includes('óleo')?'Troca de óleo':d.includes('frei')?'Freios':
              d.includes('elétri')?'Elétrica':d.includes('suspens')||d.includes('amort')?'Suspensão':
              d.includes('alinha')?'Alinhamento':'Outros';
    sf[k] = (sf[k]||0)+1;
  }));
  const srt = Object.entries(sf).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const mx  = srt[0]?.[1]||1;

  document.getElementById('content').innerHTML = `
  <div class="metrics">
    <div class="met" onclick="window.location.href='os.html'">
      <div class="mlbl">Atendimentos abertos</div>
      <div class="mval">${dash.ordensAbertas}</div>
      <div class="msub">em andamento / aguardando</div>
      <div class="mico" style="background:var(--ord)"><svg viewBox="0 0 24 24" fill="var(--or)" width="14" height="14"><path d="M14 2H6c-1.1 0-2 .9-2 2v16h16V8z"/></svg></div>
    </div>
    <div class="met" style="--mac:var(--gn)" onclick="window.location.href='os.html?filter=CONCLUIDO'">
      <div class="mlbl">Serviços concluídos</div>
      <div class="mval">${dash.ordensConcluidas}</div>
      <div class="msub">total no histórico</div>
      <div class="mico" style="background:var(--gnd)"><svg viewBox="0 0 24 24" fill="var(--gn)" width="14" height="14"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></div>
    </div>
    <div class="met" style="--mac:var(--bl)" onclick="window.location.href='clientes.html'">
      <div class="mlbl">Clientes ativos</div>
      <div class="mval">${dash.totalClientes}</div>
      <div class="msub">cadastrados no sistema</div>
      <div class="mico" style="background:var(--bld)"><svg viewBox="0 0 24 24" fill="var(--bl)" width="14" height="14"><path d="M16 11c1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3 1.34 3 3 3zm-8 0c1.66 0 3-1.34 3-3S9.66 5 8 5 5 6.34 5 8s1.34 3 3 3z"/></svg></div>
    </div>
    <div class="met" style="--mac:var(--yw)" onclick="window.location.href='relatorios.html'">
      <div class="mlbl">Faturamento concluído</div>
      <div class="mval" style="font-size:14px">${fmtCur(dash.faturamentoConcluido)}</div>
      <div class="msub">ticket médio ${fmtCur(dash.ticketMedio)}</div>
      <div class="mico" style="background:var(--ywd)"><svg viewBox="0 0 24 24" fill="var(--yw)" width="14" height="14"><path d="M11.8 10.9c-2.27-.59-3-1.2-3-2.15 0-1.09 1.01-1.85 2.7-1.85 1.78 0 2.44.85 2.5 2.1h2.21c-.07-1.72-1.12-3.3-3.21-3.81V3h-3v2.16c-1.94.42-3.5 1.68-3.5 3.61 0 2.31 1.91 3.46 4.7 4.13 2.5.6 3 1.48 3 2.41 0 .69-.49 1.79-2.7 1.79-2.06 0-2.87-.92-2.98-2.1h-2.2c.12 2.19 1.76 3.42 3.68 3.83V21h3v-2.15c1.95-.37 3.5-1.5 3.5-3.55 0-2.84-2.43-3.81-4.7-4.4z"/></svg></div>
    </div>
  </div>

  <div class="g2">
    <div class="card">
      <div class="chd">
        <div class="ctitle">Ordens recentes</div>
        <button class="btn btn-g sm" onclick="window.location.href='os.html'">Ver todas →</button>
      </div>
      <div class="tbl-wrap tbl-desktop"><table class="tbl">
        <thead><tr><th>OS</th><th>Cliente</th><th>Veículo</th><th>Status</th><th style="text-align:right">Total</th></tr></thead>
        <tbody>${recentes.map(o=>`<tr style="cursor:pointer" onclick="window.location.href='os.html?action=print&id=${o.id}'">
          <td class="osnum">${osNum(o.id)}</td>
          <td>${o.clienteNome||'—'}</td>
          <td style="color:var(--tx2)">${o.veiculoDesc||'—'}</td>
          <td>${sBadge(o.status)}</td>
          <td style="font-weight:700;text-align:right;color:var(--or)">${fmtCur(o.total)}</td>
        </tr>`).join('')}</tbody>
      </table></div>
      <div class="mob-list cbd">${recentes.map(o=>`<div class="mob-card" onclick="window.location.href='os.html?action=print&id=${o.id}'">
        <div class="mob-card-top"><span class="osnum">${osNum(o.id)}</span>${sBadge(o.status)}</div>
        <div class="mob-card-sub">${o.clienteNome||'—'} · ${o.veiculoDesc||'—'}</div>
        <div style="font-weight:700;color:var(--or);font-size:15px">${fmtCur(o.total)}</div>
      </div>`).join('')}</div>
    </div>

    <div style="display:flex;flex-direction:column;gap:14px">
      <div class="card">
        <div class="chd"><div class="ctitle">Serviços mais comuns</div></div>
        <div class="cbd">${srt.length ? srt.map(([l,n])=>`<div class="prow">
          <div style="font-size:12px;color:var(--tx2);width:88px;flex-shrink:0">${l}</div>
          <div class="pbar"><div class="pfill" style="width:${Math.round(n/mx*100)}%"></div></div>
          <div style="font-size:12px;color:var(--tx2);width:20px;text-align:right">${n}</div>
        </div>`).join('') : '<div style="color:var(--tx3);font-size:12px">Sem dados.</div>'}</div>
      </div>

      ${alertas.length ? `<div class="card" style="border-color:rgba(239,68,68,.2)">
        <div class="chd"><div class="ctitle" style="color:var(--rd)">Alertas de estoque</div>
          ${user.perfil!=='SERVICOS'?`<button class="btn btn-g sm" onclick="window.location.href='estoque.html'">Gerenciar</button>`:''}
        </div>
        <div class="cbd" style="padding-top:10px">
          ${alertas.map(e=>`<div class="ai">
            <svg viewBox="0 0 24 24" fill="currentColor" width="14" height="14"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
            <div style="font-size:13px;flex:1">${e.nome}</div>
            <div style="font-size:12px;color:var(--rd);font-weight:600">${e.quantidade} un.</div>
          </div>`).join('')}
        </div>
      </div>` : `<div class="card">
        <div class="chd"><div class="ctitle" style="color:var(--gn)">Estoque em dia</div></div>
        <div class="cbd"><div style="font-size:12px;color:var(--tx2)">Todos os itens acima do mínimo.</div></div>
      </div>`}
    </div>
  </div>`;
}

main();
</script>
</body>
</html>
